[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  framework = "#static"
  publish = "public"

[functions]
  node_bundler = "esbuild"

# Заголовки безопасности для всех страниц и API:
# - CSP: скрипты и запросы только с этого же сайта (защита от XSS и подмены скриптов);
# - сайт нельзя встроить в чужую страницу (защита от clickjacking);
# - только HTTPS (HSTS), без утечки адреса в Referer, без доступа к камере/микрофону/геолокации.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Любой адрес сайта открывает интерфейс (кроме /api/*, его обслуживает функция)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
